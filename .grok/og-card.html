<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Syne";
      src: url("fonts/Syne-Bold.ttf") format("truetype");
      font-weight: 400 800;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Outfit";
      src: url("fonts/Outfit-SemiBold.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #08080A;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      color: #F3F1EB;
      background: #08080A;
    }
    .split {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .split img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .barber { object-position: 42% 38%; }
    .auto { object-position: 58% 48%; }
    .veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(8, 8, 10, 0.18) 0%,
          rgba(8, 8, 10, 0.55) 22%,
          rgba(8, 8, 10, 0.88) 38%,
          rgba(8, 8, 10, 0.94) 50%,
          rgba(8, 8, 10, 0.88) 62%,
          rgba(8, 8, 10, 0.55) 78%,
          rgba(8, 8, 10, 0.22) 100%
        ),
        linear-gradient(
          180deg,
          rgba(8, 8, 10, 0.42) 0%,
          rgba(8, 8, 10, 0.12) 22%,
          rgba(8, 8, 10, 0.12) 78%,
          rgba(8, 8, 10, 0.5) 100%
        );
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      pointer-events: none;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .tick {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(243, 241, 235, 0.34);
      border-style: solid;
      pointer-events: none;
      z-index: 3;
    }
    .tick-tl { top: 28px; left: 28px; border-width: 1.5px 0 0 1.5px; }
    .tick-tr { top: 28px; right: 28px; border-width: 1.5px 1.5px 0 0; }
    .tick-bl { bottom: 28px; left: 28px; border-width: 0 0 1.5px 1.5px; }
    .tick-br { bottom: 28px; right: 28px; border-width: 0 1.5px 1.5px 0; }
    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .mark {
      width: 36px;
      height: 36px;
      margin-bottom: 26px;
    }
    .title {
      margin: 0;
      font-family: Syne, Outfit, sans-serif;
      font-weight: 750;
      font-size: 118px;
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      line-height: 1;
      color: #F3F1EB;
      text-shadow: 0 2px 28px rgba(8, 8, 10, 0.55);
    }
    .rule {
      width: 92px;
      height: 2px;
      background: #2EE6D6;
      margin: 26px 0 18px;
      box-shadow: 0 0 16px rgba(46, 230, 214, 0.55);
    }
    .tag {
      margin: 0;
      font-family: Outfit, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.46em;
      padding-left: 0.46em;
      color: #E7B48A;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="split">
      <img class="barber" src="file:///workspace/public/media/barber-hero.jpg" alt="" />
      <img class="auto" src="file:///workspace/public/media/auto-hero.jpg" alt="" />
    </div>
    <div class="veil"></div>
    <div class="grain"></div>
    <div class="tick tick-tl"></div>
    <div class="tick tick-tr"></div>
    <div class="tick tick-bl"></div>
    <div class="tick tick-br"></div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#08080A" />
        <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#F3F1EB" stroke-width="1" opacity="0.22" />
        <path fill="#F3F1EB" d="M16 5.2 26.8 26.8H22.2L19.85 21.4H12.15L9.8 26.8H5.2L16 5.2z" />
        <path fill="#08080A" d="M16 10.4 19.05 17.6H12.95L16 10.4z" />
        <rect x="10.4" y="18.7" width="11.2" height="2.7" fill="#2EE6D6" />
      </svg>
      <h1 class="title">AXIOM</h1>
      <div class="rule"></div>
      <p class="tag">For the shop</p>
    </div>
  </div>
</body>
</html>
