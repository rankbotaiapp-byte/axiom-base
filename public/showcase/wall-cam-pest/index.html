<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/showcase/wall-cam-pest/">
<title>Wallwatch Pest Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one full-screen camera feed; square neon glass panels float over it and never scroll the page. */
:root{
  --void:#04070a; --glass:rgba(5,13,15,.72); --neon:#00ffcc;
  --neon-dim:color-mix(in srgb,var(--neon) 30%,transparent);
  --neon-faint:color-mix(in srgb,var(--neon) 12%,transparent);
  --ink:#dff5ef; --mute:#86a8a0; --warn:#ffb020;
  --display:"Sora","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font:400 15px/1.5 var(--body);overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
[hidden]{display:none!important}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:crosshair;background:var(--void)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world video,#world img,#world canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none}
#cover,#shards{filter:brightness(.66) saturate(.8) contrast(1.05)}
#cover{transition:opacity .5s}
#grade{position:absolute;inset:0;pointer-events:none;
  background:
   repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),
   linear-gradient(115deg,transparent 30%,rgba(255,255,255,.035) 44%,transparent 52%),
   radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.72) 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#marks{position:absolute;inset:0;pointer-events:none}
#stage.shake{animation:shake .45s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(5px,-3px)}40%{transform:translate(-4px,4px)}60%{transform:translate(3px,2px)}80%{transform:translate(-2px,-2px)}}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute);font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* brackets and tags (positioned every frame from the camera) */
.brk{position:absolute;left:0;top:0;--c:var(--neon-dim);--l:12px;--t:1px;opacity:.75;
  background:
   linear-gradient(var(--c),var(--c)) left top/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) left top/var(--t) var(--l) no-repeat,
   linear-gradient(var(--c),var(--c)) right top/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) right top/var(--t) var(--l) no-repeat,
   linear-gradient(var(--c),var(--c)) left bottom/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) left bottom/var(--t) var(--l) no-repeat,
   linear-gradient(var(--c),var(--c)) right bottom/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) right bottom/var(--t) var(--l) no-repeat}
.brk .tag{position:absolute;left:0;bottom:100%;margin-bottom:5px;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.brk.sel{--c:var(--neon);--l:22px;--t:2px;opacity:1;filter:drop-shadow(0 0 6px var(--neon-dim))}
.brk.sel .tag{color:var(--void);background:var(--neon);padding:4px 6px}
.brk.drawing{--c:var(--warn);--t:2px;opacity:1;outline:1px dashed var(--warn)}
.clue{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.clue i{width:12px;height:12px;border:1px solid var(--neon);transform:rotate(45deg);animation:pulse 1.8s ease-in-out infinite}
.clue span{background:rgba(4,7,10,.7);padding:4px 6px;border-left:2px solid var(--neon)}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--neon-faint)}}

/* glass panels */
.glass{background:var(--glass);border:1px solid var(--neon-dim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:fixed;z-index:5}
.glass::before,.glass::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--neon);pointer-events:none}
.glass::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.glass::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--neon)}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.6vw,44px);font-weight:800}
h2{font-size:24px;font-weight:700}
p{margin:0}
.btn{background:transparent;border:1px solid var(--neon-dim);padding:9px 14px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--neon);background:var(--neon-faint)}
.btn.pri{background:var(--neon);color:#021410;border-color:var(--neon);font-weight:500;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.btn.pri:hover{filter:brightness(1.1)}
.btn[aria-pressed="true"]{border-color:var(--neon);color:var(--neon);background:var(--neon-faint)}
.x{position:absolute;right:8px;top:8px;width:32px;height:32px;border:1px solid var(--neon-dim);background:transparent;font:500 14px/1 var(--mono)}

#top{position:fixed;left:0;right:0;top:0;height:52px;z-index:6;display:flex;align-items:center;gap:16px;padding:0 16px;background:linear-gradient(rgba(4,7,10,.9),rgba(4,7,10,.55));border-bottom:1px solid var(--neon-dim)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font:700 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font:400 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#scenes{display:flex;gap:6px;overflow-x:auto}
.feed{margin-left:auto;display:flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec{width:8px;height:8px;border-radius:50%;background:#ff3b4e;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

#intro{left:24px;bottom:84px;width:min(440px,calc(100% - 48px));padding:22px;display:grid;gap:12px;transition:opacity .4s,visibility .4s}
#intro p{color:var(--ink);max-width:44ch}
#intro.off{opacity:0;visibility:hidden}
#panel{right:16px;top:68px;width:340px;max-height:calc(100% - 150px);overflow:auto;padding:20px;display:grid;gap:10px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#panel.on{opacity:1;visibility:visible}
#panel .sub{font:400 12px/1.3 var(--mono);color:var(--mute)}
.pill{justify-self:start;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);padding:5px 8px}
dl{margin:0;display:grid;gap:8px}
dt{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
dd{margin:2px 0 0}
.svc{border-top:1px solid var(--neon-dim);padding-top:10px;display:flex;justify-content:space-between;gap:12px;font-weight:500}
.svc b{font-family:var(--mono);color:var(--neon);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap}

#chips,#dock{position:fixed;z-index:6;left:16px;right:16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar,#dock::-webkit-scrollbar{display:none}
#chips{bottom:56px}
#dock{bottom:12px}
#chips .btn,#dock .btn{background:rgba(4,7,10,.72);flex:none}
#chips .btn.pri,#dock .btn.pri{background:var(--neon)}
#chips .btn[aria-pressed="true"]{background:var(--neon);color:#021410}

.modal{position:fixed;inset:0;z-index:20;background:rgba(2,5,7,.72);display:grid;place-items:center;padding:16px}
.modal .glass{position:relative;width:min(520px,100%);max-height:100%;overflow:auto;padding:24px;display:grid;gap:14px}
.plist{list-style:none;margin:0;padding:0;display:grid}
.plist li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--neon-faint)}
.plist b{font-family:var(--mono);font-weight:500;color:var(--neon);white-space:nowrap}
.note{font-size:12px;color:var(--mute)}
.fld{display:grid;gap:4px}
.fld>span{font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fld input,.fld select,.fld textarea{background:rgba(0,0,0,.45);border:1px solid var(--neon-dim);padding:8px 10px;width:100%;border-radius:0}
.fld input[type=color]{padding:2px;height:36px}
.fld input[type=file]{padding:6px;font-size:12px}

#studio{right:0;top:52px;bottom:0;width:380px;z-index:10;display:flex;flex-direction:column;border-width:0 0 0 1px}
#studio header{padding:14px 16px 10px;display:grid;gap:8px;border-bottom:1px solid var(--neon-dim)}
#studio .tabs{display:flex;gap:6px;flex-wrap:wrap}
#sbody{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
#studio footer{padding:12px 16px;border-top:1px solid var(--neon-dim);display:flex;gap:8px;flex-wrap:wrap}
.card{border:1px solid var(--neon-faint);padding:12px;display:grid;gap:10px}
.srow{display:grid;grid-template-columns:1fr 92px 34px;gap:6px}
.srow input{background:rgba(0,0,0,.45);border:1px solid var(--neon-dim);padding:8px;min-width:0;border-radius:0}
.srow button{border:1px solid var(--neon-dim);background:transparent}
#toast{position:fixed;left:50%;top:66px;transform:translateX(-50%);z-index:30;background:var(--neon);color:#021410;font:500 12px/1.3 var(--mono);letter-spacing:.06em;padding:9px 14px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:699px){
  #top{gap:10px;padding:0 12px}
  #bookTop{display:none}
  #intro{left:12px;right:12px;width:auto;bottom:60px;padding:16px}
  #panel{left:12px;right:12px;top:auto;bottom:100px;width:auto;max-height:58%;padding:16px;gap:8px}
  h2{font-size:20px}
  #chips,#dock{left:12px;right:12px}
  #studio{left:0;right:0;top:auto;bottom:0;width:auto;height:64%;border-width:1px 0 0 0}
}
@media (prefers-reduced-motion:reduce){.clue i,.rec,#stage.shake{animation:none}}
</style>
</head>
<body>
<div id="stage" aria-label="Live view behind the wall. Tap to explore.">
  <div id="world">
    <video id="vid" muted loop playsinline autoplay preload="auto"></video>
    <img id="cover" alt="">
    <canvas id="shards" width="1024" height="576" hidden></canvas>
  </div>
  <div id="empty" hidden>No video in this scene yet. Open Customize, then Hero, and upload a looping clip.</div>
  <div id="grade"></div>
  <canvas id="fx"></canvas>
  <div id="marks"></div>
</div>

<header id="top">
  <div class="brand"><b id="bName"></b><span id="bTag"></span></div>
  <nav id="scenes" aria-label="Hero scenes"></nav>
  <div class="feed"><i class="rec"></i><span>Live</span><span id="tc">00:00:00:00</span></div>
  <button class="btn pri" id="bookTop">Book inspection</button>
</header>

<section id="intro" class="glass">
  <div class="eyebrow" id="iEyebrow"></div>
  <h1 id="iTitle"></h1>
  <p id="iText"></p>
  <div class="row"><button class="btn pri" id="openBtn">Open the wall</button></div>
</section>

<aside id="panel" class="glass" aria-live="polite">
  <button class="x" id="pClose" aria-label="Close and show the whole wall">X</button>
  <div class="eyebrow" id="pCount"></div>
  <h2 id="pName"></h2>
  <div class="sub" id="pSub"></div>
  <div class="pill" id="pRisk"></div>
  <p id="pWhy"></p>
  <dl><div><dt>Signs you might notice</dt><dd id="pSigns"></dd></div><div><dt>Where they hide</dt><dd id="pHides"></dd></div></dl>
  <div class="svc" id="pSvc"><span id="pSvcName"></span><b id="pSvcPrice"></b></div>
  <div class="row"><button class="btn pri" id="pBook">Book this inspection</button><button class="btn" id="pNext">Next pest</button></div>
</aside>

<nav id="chips" aria-label="Pests behind the wall" hidden></nav>
<div id="dock">
  <button class="btn" id="dSound" aria-pressed="false">Sound off</button>
  <button class="btn" id="dAll">Whole wall</button>
  <button class="btn" id="dRebuild">Rebuild wall</button>
  <button class="btn" id="dPrices">Services and prices</button>
  <button class="btn" id="dStudio" aria-pressed="false">Customize</button>
</div>

<div class="modal" id="modal" hidden>
  <div class="glass" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="x" id="mClose" aria-label="Close">X</button>
    <div id="mPrices">
      <div class="eyebrow">Services and prices</div>
      <h2 id="mTitle" style="margin:8px 0 6px">What we treat</h2>
      <ul class="plist" id="plist"></ul>
      <p class="note" id="pNote" style="margin:10px 0 14px"></p>
      <button class="btn pri" id="mToBook">Book an inspection</button>
    </div>
    <form id="mBook" hidden style="display:grid;gap:12px">
      <div class="eyebrow">Book an inspection</div>
      <h2>Tell us what you saw</h2>
      <label class="fld" for="bkName"><span>Your name</span><input id="bkName" autocomplete="name" required></label>
      <label class="fld" for="bkPhone"><span>Phone</span><input id="bkPhone" type="tel" autocomplete="tel" required></label>
      <label class="fld" for="bkSvc"><span>Service</span><select id="bkSvc"></select></label>
      <label class="fld" for="bkNote"><span>What you noticed</span><textarea id="bkNote" rows="2"></textarea></label>
      <button class="btn pri" type="submit" style="justify-self:start">Request inspection</button>
      <p class="note" id="bkMsg">Or call <span id="bkTel"></span>.</p>
    </form>
  </div>
</div>

<aside id="studio" class="glass" hidden aria-label="Customize this page">
  <header>
    <div class="eyebrow">Owner view. Visitors never see this panel.</div>
    <div class="tabs" id="stabs"></div>
  </header>
  <div id="sbody"></div>
  <footer>
    <button class="btn pri" id="sCopy">Copy config</button>
    <button class="btn" id="sReset">Reset to default</button>
    <button class="btn" id="sClose">Close</button>
  </footer>
</aside>
<div id="toast" role="status"></div>

<script>
/* ============================================================
   CONFIG. Everything a visitor sees comes from this one object.
   In Axiom, store it as one JSON value per business (for example
   app_settings: setting_key "hero_scene_config") and pass it in
   as window.APP_CONFIG.heroScenes before this script runs.
   Boxes are [left, top, width, height] as fractions of the video.
   ============================================================ */
const DEFAULTS = {
  brand: { name: "Wallwatch Pest Control", tag: "Demo brand", phone: "(541) 555-0142", accent: "#00ffcc" },
  copy: {
    eyebrow: "Wall-cam 02 / kitchen, north wall",
    title: "This wall looks fine.",
    text: "Three small signs say otherwise. Tap the wall to see what is living behind it.",
    priceNote: "Example prices for this demo. Change them in Customize."
  },
  services: [
    { id: "s1", name: "Whole-home inspection", price: "Free" },
    { id: "s2", name: "Termite inspection and report", price: "$95" },
    { id: "s3", name: "Ant and roach treatment", price: "$149" },
    { id: "s4", name: "Wasp nest removal", price: "$129" },
    { id: "s5", name: "Spider treatment", price: "$119" },
    { id: "s6", name: "Rodent removal and sealing", price: "From $249" }
  ],
  scenes: [{
    id: "wall", name: "Behind the wall", video: "pests.mp4", poster: "poster.jpg", cover: "wall.jpg",
    clues: [
      { at: [0.50, 0.20], label: "Hairline crack" },
      { at: [0.61, 0.85], label: "Frass (ant sawdust)" },
      { at: [0.17, 0.74], label: "Water stain" }
    ],
    targets: [
      { name: "Paper wasps", sub: "Polistes / open-comb nest", risk: "Stings", box: [0.185, 0.155, 0.14, 0.21], service: "s4",
        why: "They build under rafters and inside wall voids, and defend the nest in a group when it is bumped.",
        signs: "Wasps going in and out of one gap in the siding or eaves. A grey papery comb.", hides: "Rafters, eaves, attic corners, wall voids near vents." },
      { name: "Carpenter ants", sub: "Camponotus / wood excavators", risk: "Structural damage", box: [0.44, 0.10, 0.11, 0.39], service: "s3",
        why: "They do not eat wood. They hollow it out to nest, and they pick damp, softened framing first.",
        signs: "Small piles of sawdust-like frass under baseboards. Faint rustling in the wall at night.", hides: "Studs and sills near plumbing leaks, window frames, roof leaks." },
      { name: "Black widow", sub: "Latrodectus / venomous", risk: "Venomous bite", box: [0.70, 0.16, 0.20, 0.31], service: "s5",
        why: "Shy, but the bite needs medical attention. Most bites happen when a hand reaches into a dark corner.",
        signs: "A messy, tangled web low to the ground. A glossy black spider with a red hourglass underneath.", hides: "Crawlspaces, garages, meter boxes, stored boxes that never move." },
      { name: "Termites", sub: "Colony in damp framing", risk: "Structural damage", box: [0.10, 0.62, 0.325, 0.24], service: "s2",
        why: "They eat wood from the inside, so a joist can look solid while it is mostly hollow.",
        signs: "Mud tubes on the foundation, wood that sounds hollow when tapped, shed wings on windowsills.", hides: "Floor joists, sill plates, any wood touching soil or staying wet." },
      { name: "German cockroaches", sub: "Blattella germanica", risk: "Health hazard", box: [0.445, 0.61, 0.22, 0.25], service: "s3",
        why: "They breed fast, follow plumbing between rooms, and their droppings can trigger allergies and asthma.",
        signs: "Pepper-like droppings in cabinet corners, a musty smell, roaches scattering when a light comes on.", hides: "Behind pipes, under sinks, inside appliance motors, wall voids near water." },
      { name: "House mouse", sub: "Mus musculus", risk: "Wiring and contamination", box: [0.69, 0.52, 0.225, 0.35], service: "s6",
        why: "Mice shred insulation for nests and gnaw on wiring, which is a fire risk inside a closed wall.",
        signs: "Scratching at night, rice-sized droppings, shredded insulation, gnaw marks on food boxes.", hides: "Insulation, wall voids, behind the stove and fridge, attic edges." }
    ]
  }]
};

const KEY = "wallcam-config-v1";
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
function loadCfg() {
  const ext = window.APP_CONFIG && window.APP_CONFIG.heroScenes;
  if (ext && Array.isArray(ext.scenes) && ext.scenes.length) return clone(ext);
  try {
    const c = JSON.parse(localStorage.getItem(KEY));
    if (c && Array.isArray(c.scenes) && c.scenes.length && c.brand && Array.isArray(c.services)) return c;
  } catch (e) {}
  return clone(DEFAULTS);
}
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      const c = clone(cfg);   // files picked on this device are previews only, so they are not stored
      c.scenes = c.scenes.filter(s => !String(s.video).startsWith("blob:"));
      c.scenes.forEach(s => { if (String(s.cover).startsWith("blob:")) s.cover = ""; });
      if (c.scenes.length) localStorage.setItem(KEY, JSON.stringify(c));
    } catch (e) {}
  }, 300);
}

/* ---------- state ---------- */
let cfg = loadCfg(), si = 0, sel = -1, mode = "open", draw = -1, studioOpen = false, soundOn = false;
const scene = () => cfg.scenes[si];
const stage = $("#stage"), world = $("#world"), vid = $("#vid"), cover = $("#cover"), shardsCv = $("#shards"),
      fx = $("#fx"), marks = $("#marks"), panel = $("#panel"), intro = $("#intro"), studio = $("#studio");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let vw = 1, vh = 1, bw = 1, bh = 1, dpr = 1, L = 0, Tp = 0, W = 1, H = 1;
const cam = { cx: .5, cy: .5, z: 1, ax: 0, ay: 0, tx: .5, ty: .5, tz: 1, tax: 0, tay: 0 };
let floorY = 0;   // on phones the info panel covers the bottom, so the video may slide up to the panel's top edge

/* ---------- sound (all synthesized, plus the clip's own track) ---------- */
let ac = null;
function audio() { if (!soundOn) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) { return null; } return ac; }
function tone(f, d, g = .07, type = "sine", slide = 0) {

      return h("div", { class: "srow" }, n, p, h("button", { "aria-label": "Remove " + v.name, text: "X", onclick: () => { cfg.services.splice(i, 1); changed(); renderStudio(); } }));
    }),
    h("button", { class: "btn pri", text: "Add a service", style: "justify-self:start", onclick: () => { cfg.services.push({ id: "s" + Date.now(), name: "New service", price: "$0" }); changed(); renderStudio(); } })
  ];
  b.replaceChildren(...kids.filter(Boolean));
}
function toggleStudio(on) {
  studioOpen = on; studio.hidden = !on; $("#dStudio").setAttribute("aria-pressed", String(on));
  panel.classList.toggle("on", !on && sel >= 0 && mode === "open"); if (on) renderStudio(); aim();
}
$("#dStudio").onclick = () => toggleStudio(!studioOpen);
$("#sClose").onclick = () => toggleStudio(false);
$("#sReset").onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} cfg = clone(DEFAULTS); setScene(0); renderStudio(); toast("Back to the default page."); };
$("#sCopy").onclick = async () => {
  const text = JSON.stringify(cfg, null, 2);
  try { await navigator.clipboard.writeText(text); toast("Config copied. Paste it into this business's Axiom settings."); }
  catch (e) { toast("Copy was blocked by this browser."); }
};

/* ---------- main loop ---------- */
let last = performance.now(), t0 = last;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const k = reduce ? 1 : 1 - Math.exp(-dt * 5.5);
  for (const [a, b] of [["cx", "tx"], ["cy", "ty"], ["z", "tz"], ["ax", "tax"], ["ay", "tay"]]) cam[a] += (cam[b] - cam[a]) * k;
  W = bw * cam.z; H = bh * cam.z;
  if (draw >= 0) { L = (vw - W) / 2; Tp = cam.ay - H / 2; }
  else { L = clamp(cam.ax - cam.cx * W, Math.min(0, vw - W), 0); Tp = clamp(cam.ay - cam.cy * H, Math.min(0, floorY - H), 0); }
  world.style.transform = "translate3d(" + L.toFixed(2) + "px," + Tp.toFixed(2) + "px,0) scale(" + cam.z.toFixed(4) + ")";
  for (const e of marks.children) {
    if (e._t) { const [u, v, w, hh] = e._t.box; e.style.transform = "translate(" + (L + u * W).toFixed(1) + "px," + (Tp + v * H).toFixed(1) + "px)"; e.style.width = (w * W).toFixed(1) + "px"; e.style.height = (hh * H).toFixed(1) + "px"; }
    else e.style.transform = "translate(" + (L + e._at[0] * W - 6).toFixed(1) + "px," + (Tp + e._at[1] * H - 6).toFixed(1) + "px)";
  }
  if (mode === "breaking" && !shardsCv.hidden) drawShards(now);
  drawFx(dt);
  const s = (now - t0) / 1000, p = n => String(Math.floor(n)).padStart(2, "0");
  $("#tc").textContent = p(s / 3600) + ":" + p(s / 60 % 60) + ":" + p(s % 60) + ":" + p(s * 24 % 24);
  requestAnimationFrame(frame);
}
addEventListener("resize", layout);
setScene(0); layout(); requestAnimationFrame(frame);
</script>
